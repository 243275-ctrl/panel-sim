<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PanelSim art sheet</title>
<style>
  body { margin: 0; font: 12px system-ui, sans-serif; background: #ececec; }
  h2 { margin: 18px 12px 6px; font-size: 14px; }
  .grid { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 8px; }
  .cell { width: 108px; background: #fff; border: 1px solid #e3e6ea; border-radius: 6px;
          padding: 4px 2px 2px; text-align: center; }
  .cell svg { display: block; margin: 0 auto; }
  .cell .cap { font-size: 10px; color: #5b6470; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import React from "react";
import { createRoot } from "react-dom/client";
import { DeviceArt } from "./src/art/Pictorial.tsx";
import { LIBRARY } from "./src/data/library.ts";

const cats = {};
for (const item of LIBRARY) (cats[item.category] ??= []).push(item);

const App = () =>
  React.createElement("div", null,
    Object.entries(cats).map(([cat, items]) =>
      React.createElement("div", { key: cat },
        React.createElement("h2", null, cat),
        React.createElement("div", { className: "grid" },
          items.map((it) =>
            React.createElement("div", { className: "cell", key: it.type },
              React.createElement("svg", { width: 100, height: 100, viewBox: "-50 -50 100 100" },
                React.createElement(DeviceArt, { type: it.type })),
              React.createElement("div", { className: "cap" }, it.label),
            ),
          ),
        ),
      ),
    ),
  );

createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>

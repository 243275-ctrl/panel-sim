name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test + typecheck + build installer
        run: |
          npm test
          npm run typecheck
          npm run package:win

      - name: Upload installer to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe

      - name: Keep as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: panel-sim-windows
          path: release/*.exe
          if-no-files-found: error
